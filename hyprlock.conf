# Sumi lock screen: the clock sits inside the sun of the wallpaper.
source = ~/.config/sumi/hyprlock-colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = $sumi_wall
    blur_passes = 1
    blur_size = 3
    brightness = 0.72
    contrast = 1.0
    vibrancy = 0.1
}

# clock, inside the sun
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $sumi_ink
    font_size = 92
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 17%
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] sumi-lockinfo date
    color = $sumi_ink
    font_size = 13
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 9%
    halign = center
    valign = center
}

# weekday in kanji, under the sun
label {
    monitor =
    text = cmd[update:60000] sumi-lockinfo kanji
    color = $sumi_hi
    font_size = 22
    font_family = Noto Serif CJK JP
    position = 0, -7%
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 390, 48
    outline_thickness = 1
    rounding = -1
    outer_color = $sumi_line
    inner_color = $sumi_bg
    font_color = $sumi_hi
    font_family = JetBrainsMono Nerd Font
    check_color = $sumi_gold
    fail_color = $sumi_accent
    capslock_color = $sumi_gold
    fade_on_empty = false
    placeholder_text = <i>password</i>
    fail_text = <span>wrong password · $ATTEMPTS</span>
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    position = 0, -14%
    halign = center
    valign = center
}

label {
    monitor =
    text = fingerprint or password
    color = $sumi_mute
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = 0, -19%
    halign = center
    valign = center
}

# now playing, bottom left
label {
    monitor =
    text = cmd[update:2000] sumi-lockinfo music
    color = $sumi_dim
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 4%, 6%
    halign = left
    valign = bottom
}

# keyboard, wifi, battery, bottom right
label {
    monitor =
    text = cmd[update:5000] sumi-lockinfo status
    color = $sumi_dim
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = -4%, 6%
    halign = right
    valign = bottom
}
