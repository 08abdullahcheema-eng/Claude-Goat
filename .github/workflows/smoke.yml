name: sumi-test
on: { push: { branches: [sumi-shell-test] }, workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: test
        run: |
          sudo apt-get install -y fontconfig >/dev/null 2>&1 || true
          bash ci/test.sh 2>&1 | tail -200
      - name: publish results
        if: always()
        run: |
          mkdir -p out; cp -r out /tmp/out; cd /tmp/out
          git init -q; git checkout -q -b results; git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "results ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" results:sumi-shell-results
