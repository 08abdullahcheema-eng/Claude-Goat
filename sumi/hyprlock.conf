# Sumi lock screen: big readable clock on a softly blurred wallpaper.
# Just start typing your password and press Enter; the field appears while you type.
source = ~/.config/sumi/hyprlock-colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = $sumi_wall
    blur_passes = 3
    blur_size = 6
    brightness = 0.55
    contrast = 0.95
    vibrancy = 0.12
}

# clock
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(255, 255, 255, 0.96)
    font_size = 150
    font_family = JetBrainsMono Nerd Font ExtraBold
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(0, 0, 0, 0.55)
    position = 0, 14%
    halign = center
    valign = center
}

# date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d. %B"
    color = rgba(255, 255, 255, 0.85)
    font_size = 20
    font_family = JetBrainsMono Nerd Font Bold
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.5)
    position = 0, 2%
    halign = center
    valign = center
}

# weekday in kanji, in the theme accent
label {
    monitor =
    text = cmd[update:60000] sumi-lockinfo kanji
    color = $sumi_accent
    font_size = 18
    font_family = Noto Serif CJK JP
    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.5)
    position = 0, -3.5%
    halign = center
    valign = center
}

# password field: hidden until you type, no hint text
input-field {
    monitor =
    size = 320, 46
    outline_thickness = 2
    rounding = -1
    outer_color = $sumi_accent
    inner_color = rgba(0, 0, 0, 0.45)
    font_color = rgba(255, 255, 255, 0.95)
    font_family = JetBrainsMono Nerd Font
    check_color = $sumi_gold
    fail_color = $sumi_accent
    capslock_color = $sumi_gold
    fade_on_empty = true
    fade_timeout = 800
    placeholder_text =
    fail_text = $ATTEMPTS
    dots_size = 0.24
    dots_spacing = 0.4
    dots_center = true
    position = 0, -16%
    halign = center
    valign = center
}

# now playing, bottom left
label {
    monitor =
    text = cmd[update:2000] sumi-lockinfo music
    color = rgba(255, 255, 255, 0.7)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 4%, 5%
    halign = left
    valign = bottom
}

# keyboard, wifi, battery, bottom right
label {
    monitor =
    text = cmd[update:5000] sumi-lockinfo status
    color = rgba(255, 255, 255, 0.7)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = -4%, 5%
    halign = right
    valign = bottom
}
