# Sumi lock screen. Each theme brings its own layout (~/.config/sumi/hyprlock-theme.conf,
# written by sumi-theme from sumi/shell/locks/<theme>.conf). Type your password and press Enter.
source = ~/.config/sumi/hyprlock-colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

source = ~/.config/sumi/hyprlock-theme.conf
