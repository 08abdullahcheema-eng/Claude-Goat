# Kiri: a light clock floating in the fog, everything centred and soft
# motion: a slow fade out of the fog, the 霧の中 line breathes, the forest pictures
# dissolve into each other while it is locked
animations {
    enabled = true
    bezier = mist, 0.22, 1, 0.36, 1
    bezier = veil, 0.37, 0, 0.63, 1
    animation = fadeIn, 1, 14, veil
    animation = fadeOut, 1, 8, veil
    animation = inputFieldColors, 1, 8, veil
    animation = inputFieldFade, 1, 9, veil
    animation = inputFieldWidth, 1, 7, mist
    animation = inputFieldDots, 1, 5, veil
}
background {
    monitor =
    path = $sumi_wall
    blur_passes = 3
    blur_size = 7
    brightness = 0.62
    vibrancy = 0.12
    reload_time = 60
    reload_cmd = sumi-lockinfo nextwall
    crossfade_time = 6
}
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(255, 255, 255, 1.0)
    font_size = 170
    font_family = Space Grotesk Light
    shadow_passes = 2
    shadow_size = 10
    shadow_color = rgba(0, 0, 0, 0.25)
    position = 0, 14%
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d. %B"
    color = $sumi_fg
    font_size = 21
    font_family = Space Grotesk
    position = 0, 1%
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:150] sumi-lockinfo breath 霧の中 7000
    color = $sumi_accent
    font_size = 22
    font_family = Shippori Mincho
    position = 0, -3.5%
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 280, 46
    outline_thickness = 1
    rounding = -1
    outer_color = rgba(230, 245, 238, 0.35)
    inner_color = rgba(20, 30, 27, 0.35)
    font_color = $sumi_hi
    check_color = $sumi_accent
    fail_color = rgb(224, 138, 138)
    fade_on_empty = false
    placeholder_text =
    fail_text = $ATTEMPTS
    dots_size = 0.2
    dots_spacing = 0.5
    dots_center = true
    position = 0, 10%
    halign = center
    valign = bottom
}
label {
    monitor =
    text = cmd[update:5000] sumi-lockinfo music
    color = $sumi_dim
    font_size = 12
    font_family = Space Grotesk
    position = 0, 5%
    halign = center
    valign = bottom
}
