# Storm: a heavy clock lit by lightning
background {
    monitor =
    path = $sumi_wall
    blur_passes = 2
    blur_size = 4
    brightness = 0.55
}
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(244, 238, 255, 1.0)
    font_size = 190
    font_family = Space Grotesk Bold
    shadow_passes = 3
    shadow_size = 12
    shadow_color = rgba(180, 140, 255, 0.6)
    position = 0, 16%
    halign = center
    valign = bottom
}
label {
    monitor =
    text = cmd[update:60000] echo "<span letter_spacing='7000'>$(sumi-lockinfo long | sed 's/ · / <span foreground="##ffe14d">⚡<\/span> /')</span>"
    color = $sumi_fg
    font_size = 18
    font_family = Space Grotesk
    position = 0, 12%
    halign = center
    valign = bottom
}
input-field {
    monitor =
    size = 340, 52
    outline_thickness = 2
    rounding = -1
    outer_color = $sumi_accent
    inner_color = rgba(10, 12, 18, 0.7)
    font_color = $sumi_gold
    check_color = $sumi_gold
    fail_color = rgba(255, 107, 129, 1.0)
    fade_on_empty = true
    placeholder_text =
    fail_text = $ATTEMPTS
    dots_size = 0.26
    dots_spacing = 0.45
    dots_center = true
    position = 0, 5%
    halign = center
    valign = bottom
}
label {
    monitor =
    text = cmd[update:5000] echo "嵐   $(sumi-lockinfo status)"
    color = $sumi_dim
    font_size = 12
    font_family = Space Grotesk
    position = 3%, -4%
    halign = left
    valign = top
}
