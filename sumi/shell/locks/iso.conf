# Iso: a horizon line across the screen, a thin clock standing on it, the kanji of the coast on the left
background {
    monitor =
    path = $sumi_wall
    blur_passes = 2
    blur_size = 6
    brightness = 0.55
    contrast = 1.05
}
shape {
    monitor =
    size = 2200, 1
    color = rgba(255, 255, 255, 0.45)
    rounding = 0
    position = 0, -3%
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(255, 255, 255, 1.0)
    font_size = 200
    font_family = Inter ExtraLight
    position = -9%, 6%
    halign = right
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] echo "<span letter_spacing='6000'>$(sumi-lockinfo short)</span>"
    color = $sumi_fg
    font_size = 14
    font_family = Inter
    position = -9.3%, -6%
    halign = right
    valign = center
}
label {
    monitor =
    text = cmd[update:5000] sumi-lockinfo music
    color = $sumi_accent
    font_size = 13
    font_family = Inter
    position = 9%, -6%
    halign = left
    valign = center
}
label {
    monitor =
    text = 磯
    color = $sumi_accent
    font_size = 90
    font_family = Shippori Mincho ExtraBold
    position = 9%, 9%
    halign = left
    valign = center
}
input-field {
    monitor =
    size = 300, 42
    outline_thickness = 1
    rounding = -1
    outer_color = $sumi_accent
    inner_color = rgba(10, 18, 22, 0.45)
    font_color = $sumi_hi
    check_color = $sumi_accent
    fail_color = rgb(232, 138, 138)
    fade_on_empty = false
    placeholder_text =
    fail_text = $ATTEMPTS
    dots_size = 0.2
    dots_spacing = 0.5
    dots_center = true
    position = -9%, -14%
    halign = right
    valign = center
}
label {
    monitor =
    text = cmd[update:5000] sumi-lockinfo status
    color = $sumi_dim
    font_size = 11
    font_family = Inter
    position = -3%, 4%
    halign = right
    valign = bottom
}
