# Iso: a horizon line across the screen, a thin clock standing on it, the kanji of the coast on the left
# motion: everything rolls in on a springy curve, a dotted swell runs along the horizon,
# the three coast pictures drift into each other
animations {
    enabled = true
    bezier = wave, 0.34, 1.42, 0.64, 1
    bezier = tide, 0.6, 0, 0.2, 1
    animation = fadeIn, 1, 7, tide
    animation = fadeOut, 1, 4, tide
    animation = inputFieldColors, 1, 5, tide
    animation = inputFieldFade, 1, 5, tide
    animation = inputFieldWidth, 1, 6, wave
    animation = inputFieldDots, 1, 4, wave
}
background {
    monitor =
    path = $sumi_wall
    blur_passes = 2
    blur_size = 6
    brightness = 0.55
    contrast = 1.05
    reload_time = 60
    reload_cmd = sumi-lockinfo nextwall
    crossfade_time = 3.5
}
label {
    monitor =
    text = cmd[update:120] sumi-lockinfo wave 64
    color = rgba(143, 224, 212, 0.55)
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 0, -4.2%
    halign = center
    valign = center
}
shape {
    monitor =
    size = 2200, 1
    color = rgba(255, 255, 255, 0.45)
    rounding = 0
    position = 0, -3%
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(255, 255, 255, 1.0)
    font_size = 200
    font_family = Inter ExtraLight
    position = -9%, 6%
    halign = right
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] echo "<span letter_spacing='6000'>$(sumi-lockinfo short)</span>"
    color = $sumi_fg
    font_size = 14
    font_family = Inter
    position = -9.3%, -6%
    halign = right
    valign = center
}
label {
    monitor =
    text = cmd[update:5000] sumi-lockinfo music
    color = $sumi_accent
    font_size = 13
    font_family = Inter
    position = 9%, -6%
    halign = left
    valign = center
}
label {
    monitor =
    text = 磯
    color = $sumi_accent
    font_size = 90
    font_family = Shippori Mincho ExtraBold
    position = 9%, 9%
    halign = left
    valign = center
}
input-field {
    monitor =
    size = 300, 42
    outline_thickness = 1
    rounding = -1
    outer_color = $sumi_accent
    inner_color = rgba(10, 18, 22, 0.45)
    font_color = $sumi_hi
    check_color = $sumi_accent
    fail_color = rgb(232, 138, 138)
    fade_on_empty = false
    placeholder_text =
    fail_text = $ATTEMPTS
    dots_size = 0.2
    dots_spacing = 0.5
    dots_center = true
    position = -9%, -14%
    halign = right
    valign = center
}
label {
    monitor =
    text = cmd[update:5000] sumi-lockinfo status
    color = $sumi_dim
    font_size = 11
    font_family = Inter
    position = -3%, 4%
    halign = right
    valign = bottom
}
