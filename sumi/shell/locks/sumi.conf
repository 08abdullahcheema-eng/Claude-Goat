# Sumi: serif clock over the ink mountains, date written vertically in kanji
background {
    monitor =
    path = $sumi_wall
    blur_passes = 2
    blur_size = 5
    brightness = 0.55
    vibrancy = 0.1
}
label {
    monitor =
    text = cmd[update:1000] date +"%H<span foreground='##c8323a'>:</span>%M"
    color = rgba(242, 236, 210, 1.0)
    font_size = 150
    font_family = Shippori Mincho ExtraBold
    shadow_passes = 3
    shadow_size = 7
    shadow_color = rgba(0, 0, 0, 0.6)
    position = 0, 13%
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] echo "<span letter_spacing='6000'>$(sumi-lockinfo long)</span>"
    color = $sumi_fg
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, 1%
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] sumi-lockinfo vdate
    color = $sumi_accent
    font_size = 26
    font_family = Shippori Mincho
    position = -12%, 10%
    halign = right
    valign = center
}
label {
    monitor =
    text = ラ<br/>ー<br/>プ
    color = rgba(220, 215, 186, 0.35)
    font_size = 22
    font_family = Shippori Mincho
    position = 12%, 12%
    halign = left
    valign = center
}
input-field {
    monitor =
    size = 300, 46
    outline_thickness = 2
    rounding = -1
    outer_color = $sumi_accent
    inner_color = rgba(15, 15, 20, 0.6)
    font_color = $sumi_hi
    check_color = $sumi_gold
    fail_color = $sumi_accent
    fade_on_empty = true
    placeholder_text =
    fail_text = $ATTEMPTS
    dots_size = 0.24
    dots_spacing = 0.45
    dots_center = true
    position = 0, -14%
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:5000] sumi-lockinfo status
    color = $sumi_dim
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = -3%, 4%
    halign = right
    valign = bottom
}
