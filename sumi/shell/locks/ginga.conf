# Ginga: the clock in the middle of star trails, coordinates under it
background {
    monitor =
    path = $sumi_wall
    blur_passes = 0
    brightness = 0.72
    vibrancy = 0.1
}
shape {
    monitor =
    size = 560, 560
    color = rgba(0, 0, 0, 0)
    border_size = 1
    border_color = rgba(184, 166, 255, 0.28)
    rounding = -1
    position = 0, 6%
    halign = center
    valign = center
}
shape {
    monitor =
    size = 760, 760
    color = rgba(0, 0, 0, 0)
    border_size = 1
    border_color = rgba(255, 214, 168, 0.14)
    rounding = -1
    position = 0, 6%
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(255, 255, 255, 1.0)
    font_size = 140
    font_family = Space Grotesk Light
    shadow_passes = 3
    shadow_size = 12
    shadow_color = rgba(184, 166, 255, 0.35)
    position = 0, 8%
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] echo "<span letter_spacing='7000'>$(sumi-lockinfo sky)</span>"
    color = $sumi_accent
    font_size = 15
    font_family = Space Mono
    position = 0, 0%
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 320, 46
    outline_thickness = 1
    rounding = -1
    outer_color = rgba(184, 166, 255, 0.55)
    inner_color = rgba(5, 7, 14, 0.55)
    font_color = $sumi_hi
    check_color = $sumi_gold
    fail_color = rgb(255, 138, 168)
    fade_on_empty = false
    placeholder_text = <span letter_spacing='5000'>PASSWORT</span>
    fail_text = $ATTEMPTS
    dots_size = 0.2
    dots_spacing = 0.7
    dots_center = true
    font_family = Space Mono
    position = 0, -26%
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:5000] sumi-lockinfo status
    color = $sumi_dim
    font_size = 12
    font_family = Space Mono
    position = 0, 4%
    halign = center
    valign = bottom
}
