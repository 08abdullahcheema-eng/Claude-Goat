# Hagane: a thin steel clock in the lower left corner, date in the upper left, the field lower right
background {
    monitor =
    path = $sumi_wall
    blur_passes = 2
    blur_size = 6
    brightness = 0.5
    contrast = 1.05
}
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(255, 255, 255, 1.0)
    font_size = 250
    font_family = Inter Thin
    position = 4%, 4%
    halign = left
    valign = bottom
}
label {
    monitor =
    text = cmd[update:60000] echo "<span letter_spacing='9000'>$(date +%A | tr a-zäöü A-ZÄÖÜ)</span>"
    color = rgba(200, 200, 205, 1.0)
    font_size = 13
    font_family = Inter
    position = 4.4%, -6%
    halign = left
    valign = top
}
label {
    monitor =
    text = cmd[update:60000] echo "<span letter_spacing='9000'>$(date +%d.%m.%Y)</span>"
    color = rgba(255, 255, 255, 1.0)
    font_size = 13
    font_family = Inter
    position = 4.4%, -8.5%
    halign = left
    valign = top
}
label {
    monitor =
    text = <span letter_spacing='9000'>鋼  HAGANE</span>
    color = $sumi_accent
    font_size = 12
    font_family = Inter
    position = -4%, -6%
    halign = right
    valign = top
}
shape {
    monitor =
    size = 340, 1
    color = rgba(255, 255, 255, 0.35)
    rounding = 0
    position = -4%, 13%
    halign = right
    valign = bottom
}
input-field {
    monitor =
    size = 340, 40
    outline_thickness = 1
    rounding = 0
    outer_color = rgba(255, 255, 255, 0.55)
    inner_color = rgba(0, 0, 0, 0.25)
    font_color = rgba(255, 255, 255, 1.0)
    check_color = $sumi_accent
    fail_color = rgb(255, 138, 138)
    fade_on_empty = false
    placeholder_text =
    fail_text =
    dots_size = 0.16
    dots_spacing = 0.6
    dots_center = false
    position = -4%, 7%
    halign = right
    valign = bottom
}
label {
    monitor =
    text = cmd[update:5000] sumi-lockinfo status
    color = $sumi_dim
    font_size = 10
    font_family = Inter
    position = -4%, 4%
    halign = right
    valign = bottom
}
