# Monolith: Swiss grid, a hairline clock in the corner, one red dot
background {
    monitor =
    path = $sumi_wall
    blur_passes = 3
    blur_size = 6
    brightness = 0.5
    contrast = 0.9
}
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(255, 255, 255, 1.0)
    font_size = 230
    font_family = Inter Thin
    position = -4%, 2%
    halign = right
    valign = bottom
}
label {
    monitor =
    text = cmd[update:60000] echo "<span letter_spacing='9000'>$(date +%A | tr a-z A-Z)</span><br/><span letter_spacing='9000' foreground='##ffffff'>$(date +%d.%m.%Y)</span>"
    color = rgba(190, 190, 190, 1.0)
    font_size = 13
    font_family = Inter
    position = 4%, -6%
    halign = left
    valign = top
}
shape {
    monitor =
    size = 18, 18
    color = $sumi_accent
    rounding = -1
    position = -4.5%, -6%
    halign = right
    valign = top
}
input-field {
    monitor =
    size = 380, 40
    outline_thickness = 1
    rounding = 0
    outer_color = rgba(255, 255, 255, 0.6)
    inner_color = rgba(0, 0, 0, 0.2)
    font_color = rgba(255, 255, 255, 1.0)
    check_color = rgba(255, 255, 255, 1.0)
    fail_color = $sumi_accent
    fade_on_empty = false
    placeholder_text =
    fail_text =
    dots_size = 0.18
    dots_spacing = 0.6
    dots_center = false
    position = 4%, 8%
    halign = left
    valign = bottom
}
