# Dune: a Roman clock over the desert, the date in numerals, a teal line for the password
background {
    monitor =
    path = $sumi_wall
    blur_passes = 2
    blur_size = 5
    brightness = 0.66
    vibrancy = 0.15
}
label {
    monitor =
    text = cmd[update:1000] date +"%H<span foreground='##f0a860'>:</span>%M"
    color = rgba(255, 246, 232, 1.0)
    font_size = 180
    font_family = Cinzel
    shadow_passes = 3
    shadow_size = 12
    shadow_color = rgba(40, 20, 8, 0.5)
    position = 0, 16%
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] echo "<span letter_spacing='9000'>$(sumi-lockinfo roman)</span>"
    color = $sumi_fg
    font_size = 19
    font_family = Cinzel
    position = 0, 0%
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 320, 44
    outline_thickness = 0
    rounding = 0
    inner_color = rgba(23, 16, 13, 0.0)
    outer_color = rgba(0, 0, 0, 0)
    font_color = $sumi_hi
    check_color = $sumi_gold
    fail_color = $sumi_accent
    fade_on_empty = false
    placeholder_text = <span letter_spacing='6000'>PASSWORT</span>
    fail_text = $ATTEMPTS
    dots_size = 0.18
    dots_spacing = 0.9
    dots_center = true
    font_family = Cinzel
    position = 0, -14%
    halign = center
    valign = center
}
shape {
    monitor =
    size = 320, 2
    color = $sumi_accent
    rounding = 0
    position = 0, -16.5%
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:5000] echo "<span letter_spacing='5000'>$(sumi-lockinfo status)</span>"
    color = $sumi_dim
    font_size = 12
    font_family = Cinzel
    position = 0, 4%
    halign = center
    valign = bottom
}
