# Ember: huge stacked hours and minutes, glowing like embers
background {
    monitor =
    path = $sumi_wall
    blur_passes = 2
    blur_size = 5
    brightness = 0.45
}
label {
    monitor =
    text = cmd[update:1000] date +"%H"
    color = rgba(255, 244, 234, 1.0)
    font_size = 300
    font_family = Bebas Neue
    position = 6%, 15%
    halign = left
    valign = center
}
label {
    monitor =
    text = cmd[update:1000] date +"%M"
    color = $sumi_accent
    font_size = 300
    font_family = Bebas Neue
    shadow_passes = 3
    shadow_size = 12
    shadow_color = rgba(255, 90, 31, 0.55)
    position = 6%, -20%
    halign = left
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] sumi-lockinfo long | sed 's/ · /<br\/>/'
    color = $sumi_gold
    font_size = 34
    font_family = Bebas Neue
    position = 34%, 24%
    halign = left
    valign = center
}
input-field {
    monitor =
    size = 520, 14
    outline_thickness = 0
    rounding = 0
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(42, 26, 18, 1.0)
    font_color = $sumi_accent
    check_color = $sumi_gold
    fail_color = rgba(255, 60, 30, 1.0)
    fade_on_empty = false
    placeholder_text =
    fail_text =
    dots_size = 0.9
    dots_spacing = 0.15
    dots_rounding = 0
    dots_center = false
    position = 34%, -26%
    halign = left
    valign = center
}
label {
    monitor =
    text = cmd[update:5000] sumi-lockinfo status
    color = $sumi_dim
    font_size = 20
    font_family = Bebas Neue
    position = -4%, 5%
    halign = right
    valign = bottom
}
