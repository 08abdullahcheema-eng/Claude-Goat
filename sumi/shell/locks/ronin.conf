# Ronin: a serif clock beside the moon, a red hanko seal, 一期一会
background {
    monitor =
    path = $sumi_wall
    blur_passes = 1
    blur_size = 3
    brightness = 0.62
}
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(238, 244, 251, 1.0)
    font_size = 130
    font_family = Shippori Mincho Medium
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(150, 190, 240, 0.35)
    position = 8%, 14%
    halign = left
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] echo "<span letter_spacing='8000'>$(sumi-lockinfo long)</span>"
    color = $sumi_dim
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 8.4%, 3%
    halign = left
    valign = center
}
input-field {
    monitor =
    size = 360, 36
    outline_thickness = 1
    rounding = 0
    outer_color = rgba(207, 227, 255, 0.4)
    inner_color = rgba(5, 8, 15, 0.4)
    font_color = rgba(207, 227, 255, 1.0)
    check_color = rgba(207, 227, 255, 1.0)
    fail_color = $sumi_accent
    fade_on_empty = false
    placeholder_text =
    fail_text =
    dots_size = 0.2
    dots_spacing = 0.6
    dots_center = false
    position = 8.4%, -5%
    halign = left
    valign = center
}
shape {
    monitor =
    size = 120, 120
    color = rgba(0, 0, 0, 0)
    rounding = 10
    border_size = 6
    border_color = $sumi_accent
    rotate = -4
    position = -8%, -9%
    halign = right
    valign = top
}
label {
    monitor =
    text = 浪
    color = $sumi_accent
    font_size = 62
    font_family = Shippori Mincho ExtraBold
    rotate = -4
    position = -8.6%, -10.4%
    halign = right
    valign = top
}
label {
    monitor =
    text = 一<br/>期<br/>一<br/>会
    color = rgba(227, 235, 245, 0.75)
    font_size = 28
    font_family = Shippori Mincho
    position = -9.6%, 4%
    halign = right
    valign = center
}
