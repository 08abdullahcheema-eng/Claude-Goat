# Suna: a warm serif clock on the horizon, the date in kanji above, a sand ridge below
background {
    monitor =
    path = $sumi_wall
    blur_passes = 2
    blur_size = 6
    brightness = 0.6
    vibrancy = 0.18
}
label {
    monitor =
    text = cmd[update:60000] echo "<span letter_spacing='16000'>$(sumi-lockinfo kdate)</span>"
    color = $sumi_gold
    font_size = 22
    font_family = Shippori Mincho
    position = 0, 26%
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:1000] date +"%H<span foreground='##ff9350'>:</span>%M"
    color = rgba(255, 248, 238, 1.0)
    font_size = 190
    font_family = Shippori Mincho ExtraBold
    shadow_passes = 3
    shadow_size = 10
    shadow_color = rgba(90, 40, 10, 0.55)
    position = 0, 12%
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] echo "<span letter_spacing='7000'>$(sumi-lockinfo long)</span>"
    color = $sumi_fg
    font_size = 15
    font_family = Space Grotesk
    position = 0, -1%
    halign = center
    valign = center
}
shape {
    monitor =
    size = 220, 3
    color = $sumi_accent
    rounding = -1
    position = 0, -4.5%
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 300, 46
    outline_thickness = 2
    rounding = -1
    outer_color = $sumi_accent
    inner_color = rgba(40, 24, 12, 0.45)
    font_color = $sumi_hi
    check_color = $sumi_gold
    fail_color = rgb(240, 112, 96)
    fade_on_empty = false
    placeholder_text =
    fail_text = $ATTEMPTS
    dots_size = 0.2
    dots_spacing = 0.5
    dots_center = true
    position = 0, 10%
    halign = center
    valign = bottom
}
label {
    monitor =
    text = cmd[update:5000] sumi-lockinfo status
    color = $sumi_dim
    font_size = 11
    font_family = Space Grotesk
    position = -3%, 4%
    halign = right
    valign = bottom
}
