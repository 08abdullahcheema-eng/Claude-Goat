# Torii: a clock glowing in the shrine gate, lanterns as password dots
background {
    monitor =
    path = $sumi_wall
    blur_passes = 2
    blur_size = 6
    brightness = 0.55
}
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(255, 243, 230, 1.0)
    font_size = 160
    font_family = Shippori Mincho ExtraBold
    shadow_passes = 3
    shadow_size = 10
    shadow_color = rgba(255, 150, 60, 0.55)
    position = 0, 16%
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] echo "<span letter_spacing='9000'>$(sumi-lockinfo long)</span>"
    color = $sumi_gold
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    position = 0, 3%
    halign = center
    valign = center
}
label {
    monitor =
    text = 鳥<br/>居<br/>を<br/>く<br/>ぐ<br/>る
    color = $sumi_accent
    font_size = 30
    font_family = Shippori Mincho
    position = 7%, 14%
    halign = left
    valign = center
}
input-field {
    monitor =
    size = 340, 54
    outline_thickness = 0
    rounding = -1
    outer_color = rgba(0, 0, 0, 0)
    inner_color = rgba(0, 0, 0, 0)
    font_color = rgba(255, 179, 71, 1.0)
    check_color = rgba(255, 200, 120, 1.0)
    fail_color = $sumi_accent
    fade_on_empty = false
    placeholder_text =
    fail_text = $ATTEMPTS
    dots_size = 0.4
    dots_spacing = 0.7
    dots_rounding = 6
    dots_center = true
    position = 0, -16%
    halign = center
    valign = center
}
