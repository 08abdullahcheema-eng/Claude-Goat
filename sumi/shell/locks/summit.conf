# Summit: a thin, cold clock in the night air, contour lines, stars for the password
background {
    monitor =
    path = $sumi_wall
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
    vibrancy = 0.1
}
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(244, 248, 255, 1.0)
    font_size = 200
    font_family = Space Grotesk Light
    shadow_passes = 3
    shadow_size = 14
    shadow_color = rgba(120, 160, 230, 0.3)
    position = 0, 15%
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] echo "<span letter_spacing='16000'>$(sumi-lockinfo long)</span>"
    color = $sumi_accent
    font_size = 18
    font_family = Space Grotesk
    position = 0, -1.5%
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 300, 44
    outline_thickness = 0
    rounding = 0
    inner_color = rgba(0, 0, 0, 0)
    outer_color = rgba(0, 0, 0, 0)
    font_color = $sumi_hi
    check_color = $sumi_accent
    fail_color = rgb(240, 138, 154)
    fade_on_empty = false
    placeholder_text = <span letter_spacing='8000'>✦ ✦ ✦</span>
    fail_text = $ATTEMPTS
    dots_size = 0.16
    dots_spacing = 1.0
    dots_center = true
    position = 0, -14%
    halign = center
    valign = center
}
shape {
    monitor =
    size = 300, 1
    color = rgba(244, 248, 255, 0.6)
    rounding = 0
    position = 0, -16.4%
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] echo "<span letter_spacing='6000'>MOND $(sumi-lockinfo moon) %    $(sumi-lockinfo status)</span>"
    color = $sumi_dim
    font_size = 12
    font_family = Space Grotesk
    position = 0, 4%
    halign = center
    valign = bottom
}
