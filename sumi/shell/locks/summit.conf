# Summit: the night range under a clear clock.
# Same frame for every theme: date above, a big clock with an accent colon, a kanji line,
# one password pill with the theme's mark and your name, music bottom left, status bottom right.
animations {
    enabled = true
    bezier = descend, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 9, descend
    animation = fadeOut, 1, 5, default
    animation = inputFieldColors, 1, 5, default
    animation = inputFieldDots, 1, 3, default
}
background {
    monitor =
    path = $sumi_wall
    blur_passes = 0
    brightness = 0.66
    contrast = 1.0
    vibrancy = 0
}
label {
    monitor =
    text = cmd[update:60000] sumi-lockinfo ldate
    color = rgba(255, 255, 255, 0.82)
    font_size = 14
    font_family = Inter Medium
    position = 0, 25%
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:1000] sumi-lockinfo clockc "#9fc4ff"
    color = $sumi_hi
    font_size = 146
    font_family = Space Grotesk
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.45)
    position = 0, 10%
    halign = center
    valign = center
}
label {
    monitor =
    text = 峰  ·  月夜
    color = rgba(255, 255, 255, 0.42)
    font_size = 15
    font_family = Shippori Mincho
    position = 0, -3%
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 440, 54
    outline_thickness = 1
    rounding = -1
    outer_color = $sumi_accent_soft
    inner_color = rgba(8, 8, 12, 0.55)
    font_color = $sumi_hi
    check_color = $sumi_gold
    fail_color = $sumi_error
    fade_on_empty = false
    placeholder_text =
    fail_text = <i>$FAIL</i>
    dots_size = 0.2
    dots_spacing = 0.55
    dots_center = true
    position = 0, -20%
    halign = center
    valign = center
}
image {
    monitor =
    path = $sumi_avatar
    size = 38
    rounding = 0
    border_size = 0
    position = -194, -20%
    halign = center
    valign = center
}
label {
    monitor =
    text = $USER
    color = $sumi_fg
    font_size = 12
    font_family = Inter
    position = -145, -20%
    halign = center
    valign = center
}
label {
    monitor =
    text = ↵
    color = $sumi_accent
    font_size = 13
    font_family = Inter
    position = 196, -20%
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:0] sumi-lockinfo since
    color = rgba(255, 255, 255, 0.42)
    font_size = 10
    font_family = Inter
    position = 0, -26%
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:5000] sumi-lockinfo now "#9fc4ff"
    color = rgba(255, 255, 255, 0.72)
    font_size = 11
    font_family = Inter
    position = 48, 40
    halign = left
    valign = bottom
}
label {
    monitor =
    text = cmd[update:10000] sumi-lockinfo stat2
    color = rgba(255, 255, 255, 0.72)
    font_size = 11
    font_family = Inter
    position = -48, 40
    halign = right
    valign = bottom
}
