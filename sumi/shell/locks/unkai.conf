# Unkai: an italic serif clock resting on the cloud sea, the date in words above it
background {
    monitor =
    path = $sumi_wall
    blur_passes = 1
    blur_size = 4
    brightness = 0.78
    vibrancy = 0.12
}
label {
    monitor =
    text = cmd[update:60000] echo "<i>$(sumi-lockinfo words)</i>"
    color = $sumi_gold
    font_size = 22
    font_family = Fraunces
    position = 0, 31%
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:1000] date +"<i>%H:%M</i>"
    color = rgba(255, 244, 238, 1.0)
    font_size = 200
    font_family = Fraunces Light
    shadow_passes = 3
    shadow_size = 14
    shadow_color = rgba(255, 154, 114, 0.35)
    position = 0, 17%
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 300, 46
    outline_thickness = 1
    rounding = -1
    outer_color = rgba(255, 244, 238, 0.35)
    inner_color = rgba(11, 16, 36, 0.45)
    font_color = $sumi_hi
    check_color = $sumi_accent
    fail_color = rgb(255, 122, 138)
    fade_on_empty = false
    placeholder_text = <i>Passwort</i>
    fail_text = $ATTEMPTS
    dots_size = 0.2
    dots_spacing = 0.6
    dots_center = true
    font_family = Fraunces
    position = 0, -20%
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:5000] echo "<i>$(sumi-lockinfo status)</i>"
    color = $sumi_dim
    font_size = 13
    font_family = Fraunces
    position = 0, 4%
    halign = center
    valign = bottom
}
