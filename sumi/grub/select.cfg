# Sumi: use the boot menu theme of the desktop theme picked last (sumi-theme stores it
# in grubenv as sumi_theme, see sumi-grub-sync in sumi-login.nix)
insmod regexp
if [ -n "${sumi_theme}" ]; then
  if regexp --set=1:sumi_base '^(.*)/theme\.txt$' "${theme}"; then
    if [ -f "${sumi_base}/${sumi_theme}/theme.txt" ]; then
      set theme="${sumi_base}/${sumi_theme}/theme.txt"
      export theme
    fi
  fi
fi
